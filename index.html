```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

/* CARD */
.card{
  width:100%;
  max-width:900px;
  margin:15px;
  background:#111;
  border-radius:15px;
  overflow:hidden;
  padding:10px;
}

/* HÀNG TRÊN */
.top-row{
  display:flex;
  gap:10px;
  align-items:center;
}

/* ẢNH */
.thumb{
  flex:2;
}

.thumb img{
  width:100%;
  border-radius:10px;
}

/* NÚT */
.buttons{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.btn{
  padding:12px;
  font-size:14px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

/* Shopee */
.btn-shop{
  background:#ff5722;
}

/* Xem phim */
.btn-play{
  background:#e50914;
}

/* VIDEO */
.video{
  margin-top:15px;
  display:none;
}

.video iframe{
  width:100%;
  height:300px;
  border-radius:10px;
  border:0;
}
</style>

</head>

<body>

<div class="card">

  <!-- HÀNG TRÊN -->
  <div class="top-row">

    <div class="thumb">
      <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg">
    </div>

    <div class="buttons">
      <button class="btn btn-shop" onclick="goShopee()">🛒 Shopee</button>
      <button class="btn btn-play" onclick="playVideo()">▶ Xem phim</button>
    </div>

  </div>

  <!-- VIDEO -->
  <div class="video" id="videoBox">
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>

</div>

<script>

let redirectTimeout;

/* auto chuyển */
function startRedirect(){
  redirectTimeout = setTimeout(function(){
    window.location.href = "https://shopee.vn";
  }, 5000);
}

/* Shopee */
function goShopee(){
  clearTimeout(redirectTimeout);
  window.location.href = "https://shopee.vn";
}

/* Xem phim */
function playVideo(){
  const frame = document.getElementById("videoFrame");
  const box = document.getElementById("videoBox");

  frame.src = "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1";
  box.style.display = "block";

  box.scrollIntoView({ behavior: "smooth" });
}

window.onload = startRedirect;

</script>

</body>
</html>
```
