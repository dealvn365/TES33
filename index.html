```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim full miễn phí</title>

<meta property="og:title" content="🎬 Xem phim full miễn phí">
<meta property="og:description" content="Click để xem phim cực hay 🔥">
<meta property="og:image" content="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg">
<meta property="og:type" content="website">

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.top-image{
  padding:20px;
}

.top-image img{
  width:95%;
  max-width:900px;
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
  cursor:pointer;
}

.bottom-controls{
  padding:30px;
}

.btn{
  padding:15px 30px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:red;
  color:white;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  background:#ff2e2e;
}

.video-container{
  display:none;
  margin-top:20px;
}

.video-container iframe{
  width:95%;
  max-width:900px;
  height:500px;
  border:0;
  border-radius:15px;
}
</style>

</head>

<body>

<div class="top-image">
  <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg" onclick="playVideo()">
</div>

<div class="bottom-controls">

  <button class="btn" onclick="goShopee()">
    👉 Ghé Shopee Ủng Hộ
  </button>

  <button class="btn" onclick="playVideo()">
    ▶ Xem Phim Full
  </button>

  <div class="video-container" id="videoBox">
    <iframe id="videoFrame"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</div>

<script>

let redirectTimeout;

/* auto chuyển sau 5s */
function startRedirect(){
  redirectTimeout = setTimeout(function(){
    window.location.href = "https://shopee.vn";
  }, 5000);
}

/* bấm Shopee → dừng auto */
function goShopee(){
  clearTimeout(redirectTimeout);
  window.location.href = "https://shopee.vn";
}

/* play video (KHÔNG dừng redirect) */
function playVideo(){
  const frame = document.getElementById("videoFrame");
  const box = document.getElementById("videoBox");

  frame.src = "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1&rel=0";
  box.style.display = "block";

  box.scrollIntoView({ behavior: "smooth" });
}

/* chạy khi load */
window.onload = function(){
  startRedirect();
};

</script>

</body>
</html>
```
