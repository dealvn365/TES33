<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim full miễn phí</title>

<!-- ===== OPEN GRAPH ===== -->
<meta property="og:title" content="🎬 Xem phim full miễn phí">
<meta property="og:description" content="Click để xem phim cực hay 🔥">
<meta property="og:image" content="https://img.youtube.com/vi/g9cQTE4t5cI/maxresdefault.jpg">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

/* ===== KHỐI ẢNH ===== */
.top-image{
  padding:20px;
}

.top-image img{
  width:95%;
  max-width:900px;
  border-radius:15px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* ===== KHỐI NÚT ===== */
.bottom-controls{
  padding:30px;
}

.btn{
  padding:15px 30px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:red;
  color:white;
}

/* VIDEO */
.video-container{
  display:none;
  margin-top:20px;
}

.video-container iframe{
  width:95%;
  max-width:900px;
  height:500px;
  border:0;
  border-radius:15px;
}
</style>

</head>

<body>

<!-- ========================= -->
<!-- 🔝 KHỐI 1: HÌNH ẢNH -->
<!-- ========================= -->
<div class="top-image">
  <img src="https://img.youtube.com/vi/g9cQTE4t5cI/maxresdefault.jpg">
</div>

<!-- ========================= -->
<!-- 🔻 KHỐI 2: NÚT + VIDEO -->
<!-- ========================= -->
<div class="bottom-controls">

  <button class="btn" onclick="openShopee()">
    👉 Ghé Shopee Ủng Hộ
  </button>

  <button class="btn" onclick="playVideo()">
    ▶ Xem Phim Full
  </button>

  <div class="video-container" id="videoBox">
    <iframe id="videoFrame"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</div>

<script>

// mở Shopee tab mới
function openShopee(){
  window.open("https://shopee.vn","_blank");
}

// bật video
function playVideo(){
  document.getElementById("videoFrame").src =
  "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1&rel=0";

  document.getElementById("videoBox").style.display="block";
}

</script>

</body>
</html>
