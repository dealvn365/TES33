<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim full miễn phí</title>

<style>
body{
  margin:0;
  background:#111;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

/* CARD */
.card{
  width:95%;
  max-width:400px;
  background:#1c1c1c;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  text-align:center;
}

/* ẢNH */
.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  cursor:pointer;
}

/* NỘI DUNG */
.card-body{
  padding:15px;
}

/* NÚT */
.btn{
  display:block;
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  background:red;
  color:white;
  transition:0.3s;
}

.btn:hover{
  background:#ff2e2e;
}

/* VIDEO */
.video-container{
  display:none;
  margin-top:10px;
}

.video-container iframe{
  width:100%;
  height:220px;
  border:none;
  border-radius:15px;
}
</style>

</head>

<body>

<div class="card">

  <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg" onclick="playVideo()">

  <div class="card-body">

    <button class="btn" onclick="playVideo()">▶ Xem Phim</button>

    <button class="btn" onclick="goShopee()">👉 Ủng Hộ Shopee</button>

    <div class="video-container" id="videoBox">
      <iframe id="videoFrame" allow="autoplay" allowfullscreen></iframe>
    </div>

  </div>

</div>

<script>

/* bấm Shopee → tắt auto trong lượt truy cập này */
function goShopee(){
  sessionStorage.setItem("clickedShopee", "true");
  window.location.href = "https://shopee.vn";
}

/* play video */
function playVideo(){
  const frame = document.getElementById("videoFrame");
  const box = document.getElementById("videoBox");

  frame.src = "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1";
  box.style.display = "block";
}

/* auto chuyển sau 6s (chỉ khi CHƯA bấm Shopee) */
setTimeout(function(){
  if(!sessionStorage.getItem("clickedShopee")){
    window.location.href = "https://shopee.vn";
  }
}, 6000);

</script>
</body>
</html>
