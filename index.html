```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim full miễn phí</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
}

/* CARD */
.card{
  max-width:900px;
  margin:20px auto;
  background:#111;
  border-radius:20px;
  overflow:hidden;
}

/* ẢNH */
.top-image img{
  width:100%;
  display:block;
}

/* NÚT */
.bottom-controls{
  display:flex;
  gap:10px;
  padding:15px;
}

/* FIX quan trọng */
.btn{
  flex:1;              /* chia đều */
  padding:15px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  min-height:50px;     /* tránh bị mất */
}

/* Shopee */
.btn-shop{
  background:#ff5722;
  color:white;
}

/* Xem phim */
.btn-play{
  background:#e50914;
  color:white;
}

/* VIDEO */
.video-container{
  display:none;
  padding:15px;
}

.video-container iframe{
  width:100%;
  height:300px;
  border-radius:10px;
}
</style>

</head>

<body>

<div class="card">

  <div class="top-image">
    <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg" onclick="playVideo()">
  </div>

  <div class="bottom-controls">
    <button class="btn btn-shop" onclick="goShopee()">🛒 Shopee</button>
    <button class="btn btn-play" onclick="playVideo()">▶ Xem phim</button>
  </div>

  <div class="video-container" id="videoBox">
    <iframe id="videoFrame" allowfullscreen></iframe>
  </div>

</div>

<script>

let redirectTimeout;

/* auto chuyển */
function startRedirect(){
  redirectTimeout = setTimeout(function(){
    window.location.href = "https://shopee.vn";
  }, 5000);
}

function goShopee(){
  clearTimeout(redirectTimeout);
  window.location.href = "https://shopee.vn";
}

function playVideo(){
  const frame = document.getElementById("videoFrame");
  const box = document.getElementById("videoBox");

  frame.src = "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1";
  box.style.display = "block";
}

window.onload = startRedirect;

</script>

</body>
</html>
```
