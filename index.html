<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang Demo</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
}

/* ===== KHỐI HÌNH ẢNH TRÊN ===== */
.hero{
  height: 100vh; /* full màn hình */
  background: url("https://picsum.photos/1200/800") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:40px;
  font-weight:bold;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
}

/* ===== KHỐI NÚT BÊN DƯỚI ===== */
.buttons{
  padding:40px;
  text-align:center;
  background:#f5f5f5;
}

.buttons button{
  padding:15px 25px;
  margin:10px;
  font-size:16px;
  border:none;
  background:#ff4d4d;
  color:white;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.buttons button:hover{
  background:#e60000;
}
</style>
</head>
<body>

<!-- HÌNH Ở TRÊN -->
<div class="hero">
  THƯƠNG MẠI
</div>

<!-- NÚT Ở DƯỚI -->
<div class="buttons">
  <button onclick="alert('Nút 1')">Nút 1</button>
  <button onclick="alert('Nút 2')">Nút 2</button>
  <button onclick="alert('Nút 3')">Nút 3</button>
</div>

</body>
</html>
