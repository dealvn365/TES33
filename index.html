```html id="fixbtnfull"
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
}

/* ẢNH */
.top-image img{
  width:100%;
  max-height:60vh;   /* 🔥 chặn ảnh quá cao */
  object-fit:cover;
  display:block;
}

/* NÚT - ép luôn hiện */
.bottom-controls{
  position:fixed;      /* 🔥 luôn nằm dưới màn hình */
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:10px;
  background:#000;
  box-shadow:0 -5px 20px rgba(0,0,0,0.7);
}

/* BUTTON */
.btn{
  flex:1;
  padding:15px;
  font-size:16px;
  border:none;
  border-radius:30px;
  font-weight:bold;
  color:white;
}

/* Shopee */
.btn-shop{
  background:#ff5722;
}

/* Play */
.btn-play{
  background:#e50914;
}

/* VIDEO */
.video-container{
  display:none;
  padding:10px;
}

.video-container iframe{
  width:100%;
  height:300px;
}
</style>

</head>

<body>

<div class="top-image">
  <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg" onclick="playVideo()">
</div>

<div class="video-container" id="videoBox">
  <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<!-- 🔥 NÚT LUÔN HIỆN -->
<div class="bottom-controls">
  <button class="btn btn-shop" onclick="goShopee()">🛒 Shopee</button>
  <button class="btn btn-play" onclick="playVideo()">▶ Xem phim</button>
</div>

<script>

let redirectTimeout;

function startRedirect(){
  redirectTimeout = setTimeout(function(){
    window.location.href = "https://shopee.vn";
  }, 5000);
}

function goShopee(){
  clearTimeout(redirectTimeout);
  window.location.href = "https://shopee.vn";
}

function playVideo(){
  const frame = document.getElementById("videoFrame");
  const box = document.getElementById("videoBox");

  frame.src = "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1";
  box.style.display = "block";
}

window.onload = startRedirect;

</script>

</body>
</html>
```
