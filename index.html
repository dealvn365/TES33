```html id="layout2col_auto"
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 Xem phim</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

/* CARD */
.card{
  width:100%;
  max-width:1000px;
  margin:15px;
  background:#111;
  border-radius:15px;
  padding:10px;
}

/* 2 CỘT */
.row{
  display:flex;
  gap:10px;
}

/* ẢNH */
.thumb{
  flex:1;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

/* VIDEO */
.video{
  flex:1;
}

.video iframe{
  width:100%;
  height:100%;
  min-height:250px;
  border-radius:10px;
  border:0;
}

/* MOBILE */
@media(max-width:768px){
  .row{
    flex-direction:column;
  }
}
</style>

</head>

<body>

<div class="card">

  <div class="row">

    <!-- ẢNH -->
    <div class="thumb">
      <img src="https://img.youtube.com/vi/g9cQTE4t5cI/hqdefault.jpg" onclick="playVideo()">
    </div>

    <!-- VIDEO -->
    <div class="video">
      <iframe id="videoFrame" allowfullscreen></iframe>
    </div>

  </div>

</div>

<script>

let redirectTimeout;

/* auto chuyển sau 5s */
function startRedirect(){
  redirectTimeout = setTimeout(function(){
    window.location.href = "https://shopee.vn";
  }, 5000);
}

/* click ảnh vẫn chạy video nhưng KHÔNG dừng redirect */
function playVideo(){
  document.getElementById("videoFrame").src =
    "https://www.youtube.com/embed/g9cQTE4t5cI?autoplay=1";
}

/* chạy khi load */
window.onload = startRedirect;

</script>

</body>
</html>
```
